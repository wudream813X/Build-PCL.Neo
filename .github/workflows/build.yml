name: Clone and Build PCL.Neo Linux

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出 PCL.Neo 的源码（通过指定 repository）
    - name: Clone PCL.Neo Repository
      uses: actions/checkout@v4
      with:
        repository: 'PCL-Community/PCL.Neo' # 目标仓库的 GitHub 路径
        ref: 'main'                         # 要编译的分支，可根据需要改为其他分支
        submodules: 'recursive'             # 递归克隆子模块（非常重要）

    # 2. 安装 Linux 编译可能需要的依赖（Avalonia/SkiaSharp 在 Linux 下可能需要一些底层库）
    - name: Install Libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1 libgl1-mesa-glx

    # 3. 配置 .NET 8 环境
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 4. 恢复依赖
    - name: Restore dependencies
      run: dotnet restore

    # 5. 编译 Linux x64 独立可执行文件
    - name: Build and Publish Linux Executable
      run: |
        dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    # 6. 上传编译好的文件
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL.Neo-Linux-Artifact
        path: ./publish/
