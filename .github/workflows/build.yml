name: Clone and Build PCL.Neo Linux

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出 PCL.Neo 的源码
    - name: Clone PCL.Neo Repository
      uses: actions/checkout@v4
      with:
        repository: 'PCL-Community/PCL.Neo'
        ref: 'main'
        submodules: 'recursive'

    # 2. 安装编译/分析所需的 Linux 图形底层依赖
    - name: Install Libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1 libgl1

    # 3. 配置 .NET 环境
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 4. 恢复依赖
    - name: Restore dependencies
      run: dotnet restore

    # 5. 编译 Linux x64
    # 注意：这里去掉了 PublishSingleFile=true 
    # 增加了 IncludeNativeLibrariesForSelfContained=true 确保原生库被正确解压输出
    - name: Build and Publish Linux Executable
      run: |
        dotnet publish ./PCL.Neo/PCL.Neo.csproj -c Release -r linux-x64 --self-contained true -p:IncludeNativeLibrariesForSelfContained=true -o ./publish

    # 6. 打包整个发布文件夹为 zip，防止 Linux 下的权限和符号链接丢失
    - name: Compress Release Folder
      run: |
        cd ./publish
        zip -r ../PCL.Neo-Linux.zip ./*

    # 7. 上传压缩包
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL.Neo-Linux-Zip
        path: PCL.Neo-Linux.zip
