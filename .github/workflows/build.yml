name: Clone and Build PCL.Neo Linux

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动点击运行

jobs:
  build-linux:
    runs-on: ubuntu-latest

    # 赋予该任务写入 Release 的权限
    permissions:
      contents: write

    steps:
    # 1. 克隆源码
    - name: Clone PCL.Neo Repository
      uses: actions/checkout@v4
      with:
        repository: 'PCL-Community/PCL.Neo'
        ref: 'release'
        submodules: 'recursive'

    # 2. 安装底层图形库依赖
    - name: Install Libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1 libgl1

    # 3. 配置 .NET 环境
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 4. 注入与主项目 2.88.9 完美配对的 Linux 原生运行时
    - name: Add Matching Linux Native Assets Package
      run: |
        dotnet add ./PCL.Neo/PCL.Neo.csproj package SkiaSharp.NativeAssets.Linux --version 2.88.9

    # 5. 还原 NuGet 依赖
    - name: Restore dependencies
      run: dotnet restore

    # 6. 执行文件夹发布
    - name: Build and Publish Linux (Folder Mode)
      run: |
        dotnet publish ./PCL.Neo/PCL.Neo.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained true \
          -o ./publish

    # 7. 打包整个文件夹
    - name: Compress Release Folder
      run: |
        cd ./publish
        zip -r ../PCL.Neo-Linux.zip ./*

    # 8. 【核心改动】直接推送到 GitHub Releases
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Linux-Build           # Release 的标签名
        name: PCL.Neo Linux 最新编译产物 # Release 的标题
        draft: false
        prerelease: false
        files: PCL.Neo-Linux.zip        # 要上传的压缩包路径
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 自动调用的临时权限 Token
