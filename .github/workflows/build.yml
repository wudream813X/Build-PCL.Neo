name: Clone and Build PCL.Neo Linux

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    # 1. 克隆源码
    - name: Clone PCL.Neo Repository
      uses: actions/checkout@v4
      with:
        repository: 'PCL-Community/PCL.Neo'
        ref: 'release'
        submodules: 'recursive'

    # 2. 安装底层图形库依赖
    - name: Install Libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1 libgl1

    # 3. 配置 .NET 环境
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 4. 【关键修正】强行注入与源码匹配的旧版 88.1.3 Linux 运行时包
    - name: Add Matching Linux Native Assets Package
      run: |
        dotnet add ./PCL.Neo/PCL.Neo.csproj package SkiaSharp.NativeAssets.Linux --version 88.1.3

    # 5. 还原 NuGet 依赖
    - name: Restore dependencies
      run: dotnet restore

    # 6. 执行文件夹发布
    - name: Build and Publish Linux (Folder Mode)
      run: |
        dotnet publish ./PCL.Neo/PCL.Neo.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained true \
          -o ./publish

    # 7. 打包整个文件夹
    - name: Compress Release Folder
      run: |
        cd ./publish
        zip -r ../PCL.Neo-Linux.zip ./*

    # 8. 上传
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PCL.Neo-Linux-Package
        path: PCL.Neo-Linux.zip
